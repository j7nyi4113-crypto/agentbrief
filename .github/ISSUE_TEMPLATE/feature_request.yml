name: Feature request
description: A language, manifest or workflow agentbrief should understand
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: Which repo layout or ecosystem should be detected, and what it should produce.
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Example repository
      description: A public repo that shows the case (optional but very helpful).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to send a PR
